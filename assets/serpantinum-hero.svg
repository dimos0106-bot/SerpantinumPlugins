<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Serpantinum Plugins</title>
  <desc id="desc">A dark, atmospheric banner with neon cyan and violet accents, audio waveforms, and a desktop plugin interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset=".55" stop-color="#111026"/>
      <stop offset="1" stop-color="#081B27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66F0DE"/>
      <stop offset=".48" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#D58AFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2036" stop-opacity=".96"/>
      <stop offset="1" stop-color="#111B2B" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67F0DE"/>
      <stop offset=".45" stop-color="#6579EF"/>
      <stop offset="1" stop-color="#CC7BFF"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#36DFD0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#36DFD0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#B8C8FF" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00040A" flood-opacity=".5"/>
    </filter>
  </defs>
